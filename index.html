<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bot Controller - KALL XTREME X</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
        body { background:#0d1117; color:#e6edf3; min-height:100vh; display:flex; justify-content:center; padding:20px; }
        .container { max-width:1200px; width:100%; }
        .header { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid #21262d; margin-bottom:30px; flex-wrap:wrap; gap:12px; }
        .header h1 { font-size:24px; background:linear-gradient(135deg,#58a6ff,#3fb950); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .status-badge { display:flex; align-items:center; gap:8px; background:#161b22; padding:8px 16px; border-radius:20px; font-size:14px; }
        .status-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
        .status-dot.online { background:#3fb950; }
        .status-dot.offline { background:#f85149; }
        .status-dot.loading { background:#d29922; }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:30px; }
        @media (max-width:768px){ .grid-2{ grid-template-columns:1fr; } }
        .card { background:#161b22; border:1px solid #21262d; border-radius:12px; padding:20px; transition:border-color .2s; }
        .card:hover { border-color:#30363d; }
        .card h3 { font-size:14px; text-transform:uppercase; letter-spacing:0.5px; color:#8b949e; margin-bottom:12px; }
        .card .value { font-size:28px; font-weight:700; }
        .card .sub { font-size:14px; color:#8b949e; margin-top:4px; }
        .menu-section { background:#161b22; border:1px solid #21262d; border-radius:12px; padding:20px; margin-bottom:30px; }
        .menu-section h2 { font-size:18px; margin-bottom:16px; color:#f0f6fc; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
        .menu-section h2 span { font-size:13px; color:#8b949e; font-weight:400; }
        .menu-grid { display:flex; flex-wrap:wrap; gap:10px; }
        .menu-btn { background:#21262d; border:1px solid #30363d; color:#c9d1d9; padding:8px 16px; border-radius:8px; font-size:13px; cursor:pointer; transition:all .2s; font-weight:500; }
        .menu-btn:hover { background:#30363d; border-color:#58a6ff; color:#fff; transform:translateY(-2px); }
        .menu-btn.danger:hover { border-color:#f85149; }
        .menu-btn.primary { background:#238636; border-color:#2ea043; color:#fff; }
        .menu-btn.primary:hover { background:#2ea043; }
        .bot-list { margin-top:20px; }
        .bot-item { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#0d1117; border-radius:8px; margin-bottom:8px; border-left:3px solid #30363d; flex-wrap:wrap; gap:8px; }
        .bot-item.online { border-left-color:#3fb950; }
        .bot-item.offline { border-left-color:#f85149; }
        .bot-info { display:flex; align-items:center; gap:12px; }
        .bot-number { font-weight:600; font-size:15px; }
        .bot-status { font-size:12px; padding:2px 10px; border-radius:12px; background:#21262d; }
        .bot-status.online { background:#1b3a2b; color:#3fb950; }
        .bot-status.offline { background:#3a1b1b; color:#f85149; }
        .bot-actions { display:flex; gap:6px; }
        .bot-actions button { background:#21262d; border:none; color:#c9d1d9; padding:4px 12px; border-radius:4px; font-size:12px; cursor:pointer; transition:.2s; }
        .bot-actions button:hover { background:#30363d; }
        .terminal { background:#0d1117; border:1px solid #21262d; border-radius:8px; padding:16px; font-family:'Courier New',monospace; font-size:13px; min-height:120px; max-height:300px; overflow-y:auto; margin-top:20px; white-space:pre-wrap; word-break:break-all; }
        .terminal .prompt { color:#58a6ff; }
        .terminal .success { color:#3fb950; }
        .terminal .error { color:#f85149; }
        .cmd-row { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
        .cmd-row input { flex:1; background:#0d1117; border:1px solid #21262d; border-radius:8px; padding:12px 16px; color:#e6edf3; font-size:14px; min-width:200px; }
        .cmd-row input:focus { outline:none; border-color:#58a6ff; }
        .cmd-row button { padding:12px 24px; background:#238636; border:none; border-radius:8px; color:#fff; font-weight:600; cursor:pointer; transition:.2s; }
        .cmd-row button:hover { background:#2ea043; }
        .menu-category { margin-bottom:16px; }
        .menu-category-title { color:#8b949e; font-size:13px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; display:block; }
        .bot-address { background:#161b22; padding:4px 12px; border-radius:12px; font-size:13px; color:#58a6ff; }
        @media (max-width:480px){ .header h1{font-size:18px;} .card .value{font-size:22px;} .menu-btn{padding:6px 12px;font-size:12px;} .bot-item{flex-direction:column;align-items:stretch;} .bot-actions{justify-content:flex-end;} }
    </style>
</head>
<body>
<div class="container">

    <header class="header">
        <h1>🤖 BOT CONTROLLER</h1>
        <div class="status-badge">
            <span class="status-dot online" id="statusDot"></span>
            <span id="statusText">Online</span>
            <span style="color:#8b949e;margin-left:8px;">|</span>
            <span id="botCount">0 bot</span>
        </div>
    </header>

    <div class="grid-2">
        <div class="card">
            <h3>📱 BOT TERDAFTAR</h3>
            <div class="value" id="totalBots">0</div>
            <div class="sub">Total bot dari jadibot</div>
        </div>
        <div class="card">
            <h3>📊 STATUS BOT UTAMA</h3>
            <div class="value" id="mainBotStatus">🟢 Aktif</div>
            <div class="sub" id="mainBotAddress">-</div>
        </div>
    </div>

    <div class="menu-section">
        <h2>📋 SEMUA MENU BOT <span id="menuCount">Loading...</span></h2>
        <div id="menuContainer">
            <div style="color:#8b949e;font-size:14px;">⏳ Memuat menu dari bot...</div>
        </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
        <h3>📱 BOT SENDER AKTIF</h3>
        <div id="botListContainer">
            <div style="color:#8b949e;font-size:14px;">⏳ Memuat daftar bot...</div>
        </div>
    </div>

    <div class="card">
        <h3>⌨️ KONSOLE PERINTAH</h3>
        <div class="cmd-row">
            <input type="text" id="cmdInput" placeholder=".bot 1 listgrub" />
            <button onclick="sendCustomCommand()">▶ Kirim</button>
        </div>
        <div class="terminal" id="terminalOutput">
            <span class="prompt">[KALL]</span> Dashboard siap. Kirim perintah untuk mengontrol bot.
        </div>
    </div>

</div>

<script>
// ============================================================
// KONFIGURASI – OTOMATIS AMBIL DARI API STATUS
// ============================================================
const API_BASE = window.location.origin; // https://bot-dashboard.vercel.app

let botAddress = null;

// ============================================================
// AMBIL STATUS BOT DARI SERVER
// ============================================================
async function fetchBotStatus() {
    try {
        const res = await fetch(`${API_BASE}/api/status`);
        if (!res.ok) throw new Error('Bot not registered');
        const data = await res.json();
        botAddress = data.address;
        document.getElementById('mainBotAddress').innerText = botAddress;
        if (data.online) {
            updateStatus('online');
        } else {
            updateStatus('offline');
            document.getElementById('mainBotAddress').innerText += ' (offline)';
        }
        return botAddress;
    } catch (err) {
        botAddress = null;
        document.getElementById('mainBotAddress').innerText = '❌ Bot belum terdaftar';
        updateStatus('offline');
        return null;
    }
}

// ============================================================
// FUNGSI UTAMA
// ============================================================
async function runCommand(cmd) {
    const output = document.getElementById('terminalOutput');
    output.innerHTML = `<span class="prompt">[KALL]</span> ⏳ Menjalankan: ${cmd} ...`;

    // Pastikan ada address
    if (!botAddress) {
        await fetchBotStatus();
        if (!botAddress) {
            output.innerHTML = `<span class="prompt">[KALL]</span> <span class="error">❌ Bot tidak terdaftar. Pastikan bot sudah jalan dan register ke server.</span>`;
            return;
        }
    }

    try {
        const res = await fetch(`${API_BASE}/api/command`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command: cmd })
        });
        const data = await res.json();
        if (data.success) {
            output.innerHTML = `<span class="prompt">[KALL]</span> <span class="success">✅ Berhasil</span>\n${data.result || 'Perintah berhasil dijalankan.'}`;
            updateStatus('online');
        } else {
            output.innerHTML = `<span class="prompt">[KALL]</span> <span class="error">❌ Gagal</span>\n${data.error || 'Terjadi kesalahan.'}`;
            updateStatus('offline');
        }
    } catch (err) {
        output.innerHTML = `<span class="prompt">[KALL]</span> <span class="error">❌ Koneksi gagal</span>\n${err.message}`;
        updateStatus('offline');
    }
}

function sendCustomCommand() {
    const input = document.getElementById('cmdInput');
    if (input.value.trim()) {
        runCommand(input.value.trim());
        input.value = '';
    }
}
document.getElementById('cmdInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendCustomCommand();
});

function updateStatus(state) {
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    dot.className = 'status-dot ' + state;
    text.innerText = state === 'online' ? 'Online' : state === 'offline' ? 'Offline' : 'Loading';
}

// ============================================================
// LOAD MENU OTOMATIS DARI BOT
// ============================================================
async function loadMenu() {
    const container = document.getElementById('menuContainer');
    const countEl = document.getElementById('menuCount');
    
    // Ambil menu langsung dari bot melalui proxy
    try {
        if (!botAddress) await fetchBotStatus();
        if (!botAddress) throw new Error('Bot not registered');

        const res = await fetch(`${API_BASE}/api/menu-proxy`); // Kita perlu buat endpoint proxy
        // Atau bisa langsung fetch ke bot: `http://${botAddress}/menu-html`
        const menuRes = await fetch(`http://${botAddress}/menu-html`);
        if (!menuRes.ok) throw new Error('Gagal load menu');
        const html = await menuRes.text();
        container.innerHTML = html;
        const btns = container.querySelectorAll('.menu-btn');
        countEl.textContent = `${btns.length} command`;
    } catch (err) {
        container.innerHTML = `<div style="color:#f85149;">❌ Gagal load menu: ${err.message}</div>`;
        countEl.textContent = 'Error';
    }
}

// ============================================================
// LOAD DAFTAR BOT DARI BOT
// ============================================================
async function fetchBots() {
    try {
        if (!botAddress) await fetchBotStatus();
        if (!botAddress) throw new Error('Bot not registered');

        const res = await fetch(`http://${botAddress}/bots`);
        if (!res.ok) throw new Error('Gagal fetch bots');
        const bots = await res.json();
        renderBotList(bots);
        document.getElementById('totalBots').innerText = bots.filter(b => b.status === 'online').length;
        document.getElementById('botCount').innerText = bots.filter(b => b.status === 'online').length + ' bot online';
    } catch (err) {
        document.getElementById('botListContainer').innerHTML = 
            `<div style="color:#f85149;">❌ Gagal load bot: ${err.message}</div>`;
    }
}

function renderBotList(bots) {
    const container = document.getElementById('botListContainer');
    if (!bots || bots.length === 0) {
        container.innerHTML = `<div style="color:#8b949e;">📭 Belum ada bot terdaftar.</div>`;
        return;
    }
    container.innerHTML = bots.map((bot, i) => `
        <div class="bot-item ${bot.status || 'offline'}">
            <div class="bot-info">
                <span class="bot-number">${bot.number}</span>
                <span class="bot-status ${bot.status || 'offline'}">${(bot.status || 'offline').toUpperCase()}</span>
                ${bot.isMain ? '⭐' : ''}
                ${bot.name ? `<span style="color:#8b949e;font-size:12px;">(${bot.name})</span>` : ''}
            </div>
            <div class="bot-actions">
                ${bot.status === 'online' ? `
                    <button onclick="runCommand('bot ${i+1} listgrub')">List Grup</button>
                    <button onclick="runCommand('bot ${i+1} chat 628xxx test')">Chat</button>
                    <button onclick="runCommand('bot ${i+1} kudeta link 628xxx')">Kudeta</button>
                ` : '<span style="color:#8b949e;font-size:12px;">Offline</span>'}
            </div>
        </div>
    `).join('');
}

// ============================================================
// INIT
// ============================================================
(async function init() {
    await fetchBotStatus();
    await loadMenu();
    await fetchBots();
})();

// Refresh status tiap 30 detik
setInterval(async () => {
    await fetchBotStatus();
}, 30000);

console.log('[KALL] Dashboard siap!');
</script>
</body>
</html>
